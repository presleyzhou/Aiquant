[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Two top-level packages (app + the vendored fincept_terminal), so auto-discovery
# can't guess; list them explicitly.
[tool.setuptools.packages.find]
include = ["app*", "fincept_terminal*"]

[project]
name = "aiquant-backend"
version = "0.1.0"
description = "AI quant terminal backend — FastAPI over vendored fincept-terminal data layer"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # payments service (kept on httpx — see requirements.txt for why)
    "httpx>=0.27",
    # vendored fincept providers are async and import aiohttp,
    # which upstream forgot to declare in requires_dist
    "aiohttp>=3.10",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "numpy>=1.26",
    "anthropic>=0.69",
    "websockets>=13.0",
]

[project.optional-dependencies]
# AkShare (Sina Finance US daily bars, forward-adjusted). Optional: ~100 MB of
# extra wheels, so it stays out of the Vercel bundle; local/Docker only.
akshare = ["akshare>=1.14"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "DTZ", "S110", "PLR0124"]
# Consciously accepted: blind excepts are logged and guard data-provider
# edges; naive date.today() is what the product means; the remaining RUF
# nits are style-only.
ignore = ["E501", "E702", "BLE001", "DTZ011", "RUF046", "RUF007", "RUF012", "UP031", "B008", "RUF001", "RUF002", "RUF003"]
