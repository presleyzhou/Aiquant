name: Live data check

# Nightly real-data integration test. The unit tests mock every provider, so
# this is the only place the actual Binance / CoinGecko / Yahoo (and AkShare
# when installed) responses meet the pipeline: download each built-in panel,
# run the default pipeline, build a rebalance ticket. On failure it opens (or
# updates) one issue labelled `live-check`; the next green run closes it.
on:
  schedule:
    - cron: "20 23 * * 1-5"   # 23:20 UTC weekdays — after the ops pass
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e .
      - name: Download panels, run the pipeline, build a ticket
        id: check
        env:
          PANEL_PROVIDER_CRYPTO: binance
          PANEL_PROVIDER_US: ${{ vars.PANEL_PROVIDER_US || 'auto' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/live_check.py --out live-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: backend/live-check.json
          retention-days: 14
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'live-check.json was not written (the script crashed before producing a report).';
            try {
              const rep = JSON.parse(fs.readFileSync('backend/live-check.json', 'utf8'));
              body = rep.markets.map(m => {
                const d = m.steps.download || {}, p = m.steps.pipeline || {}, t = m.steps.ticket || {};
                return `### ${m.market} — ${m.ok ? 'ok' : 'FAILED'}\n` +
                  `- provider: ${d.provider ?? '—'}, symbols ${d.symbols ?? '—'}/${d.expected_symbols ?? '—'}, last bar ${d.last_bar ?? '—'} (${d.stale_days ?? '—'} d old), download ${d.seconds ?? '—'} s\n` +
                  `- pipeline: Sharpe ${p.sharpe ?? '—'}, holdout ${p.holdout_sharpe ?? '—'}, ${p.targets ?? '—'} targets, ${p.seconds ?? '—'} s\n` +
                  `- ticket: ${t.orders ?? '—'} orders\n` +
                  (m.problems.length ? `- **problems:** ${m.problems.join('; ')}\n` : '') +
                  (m.traceback ? '\n```\n' + m.traceback + '\n```\n' : '');
              }).join('\n');
            } catch (e) {}
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const text = `The nightly real-data check failed on ${new Date().toISOString().slice(0, 10)}.\n\n${body}\nRun: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'live-check', per_page: 1 });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: text });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'Live data check failing', labels: ['live-check'], body: text });
            }
      - name: Close the failure issue when green again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'live-check', per_page: 5 });
            for (const issue of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: 'The live data check passed again; closing.' });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
